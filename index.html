<!DOCTYPE html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Coffee cost counter</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>☕</text></svg>">
<style>
:root{--bg:#faf7f2;--card:#fff;--text:#2b2118;--muted:#7a6a5c;--accent:#6f4e37;--accent-t:#fff;--line:#e6ddd2;--good:#2e7d32;--bad:#c62828;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1c1612;--card:#2a211b;--text:#f3ebe3;--muted:#b3a291;--accent:#c89b7b;--accent-t:#1c1612;--line:#3d3027;--good:#81c784;--bad:#ef9a9a}}
:root[data-theme="dark"]{--bg:#1c1612;--card:#2a211b;--text:#f3ebe3;--muted:#b3a291;--accent:#c89b7b;--accent-t:#1c1612;--line:#3d3027;--good:#81c784;--bad:#ef9a9a}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;line-height:1.4}
main{max-width:480px;margin:0 auto;padding:16px}
h1{font-size:20px;margin:8px 0 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:16px;margin-bottom:16px}
.count{font-size:64px;font-weight:700;text-align:center;line-height:1}
.sub{text-align:center;color:var(--muted);margin:4px 0 14px;font-size:14px}
button{font:inherit;cursor:pointer}
#add{width:100%;padding:22px;font-size:22px;font-weight:700;border:0;border-radius:14px;background:var(--accent);color:var(--accent-t)}
#add:active{transform:scale(.98)}
#bagbtn{width:100%;padding:14px;font-size:17px;font-weight:600;border:1px solid var(--accent);border-radius:12px;background:none;color:var(--accent);margin-bottom:8px}
#undo,#bagundo,#csv,#restore{width:100%;margin-top:10px;width:100%;padding:10px;border:1px solid var(--line);border-radius:10px;background:none;color:var(--muted)}
h2{font-size:15px;margin:0 0 10px;color:var(--muted);text-transform:uppercase;letter-spacing:.04em}
label{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
label:last-child{border-bottom:0}
input{width:100px;font:inherit;text-align:right;padding:6px 8px;border:1px solid var(--line);border-radius:8px;background:var(--bg);color:var(--text)}
.row{display:flex;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--line);font-size:15px}
.row:last-child{border-bottom:0}
.row b{font-variant-numeric:tabular-nums}
.neg{color:var(--bad)}.pos{color:var(--good)}
#note{font-size:12px;color:var(--muted);text-align:center}
</style>
</head>
<body>
<main>
<h1>Coffee cost counter</h1>

<div class="card">
  <div class="count" id="total">0</div>
